<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Online Compiler — Payoda</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">P</span><span class="brand-name">payoda</span></div>
    <nav>
      <div class="nav-group">Opportunity</div>
      <a class="nav-item" data-nav="compiler" href="/index.html">Online Compiler</a>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <span class="breadcrumb">Opportunity / <strong>Online Compiler</strong></span>
      <span class="user"><span id="user-name"></span> <button id="logout" class="link-btn">Sign out</button></span>
    </header>

    <section id="problem-list" class="panel"></section>

    <section id="workspace" class="workspace hidden">
      <div class="problem-pane">
        <h2 id="problem-title"></h2>
        <p id="problem-statement"></p>
        <h3>Test cases</h3>
        <div id="test-list"></div>
      </div>

      <div class="editor-pane">
        <div class="editor-header">
          <span>Code</span>
          <div class="editor-actions">
            <span id="timer" class="timer"></span>
            <span id="lang-label" class="lang"></span>
            <button id="run" class="btn-run">Run</button>
            <button id="submit" class="btn-submit">Submit</button>
          </div>
        </div>
        <textarea id="code"></textarea>
        <div id="results" class="results"></div>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="/shell.js"></script>
  <script src="/candidate.js"></script>
</body>
</html>
